name: LifeCity checks
on:
  workflow_dispatch:
    inputs:
      browser_grep:
        description: 'Optional focused browser title pattern; blank runs every browser case'
        required: false
        default: ''
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run browser checks
        env:
          BROWSER_GREP: ${{ inputs.browser_grep || '' }}
        run: |
          if [ -n "$BROWSER_GREP" ]; then
            npm run test:e2e -- --grep "$BROWSER_GREP"
          else
            npm run test:e2e
          fi
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report
          retention-days: 7
